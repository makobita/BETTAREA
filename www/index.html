<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<script>try{var t=localStorage.getItem('bettarea-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('bettarea-avisos')==='off')document.documentElement.setAttribute('data-noavisos','');}catch(e){}</script>
<title>Bettarea · Control interno</title>
<meta name="app-version" content="0.3.4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6600; --orange-d:#E25A00; --orange-50:#FFF3EA; --orange-100:#FFE3CF;
  --ink:#141414; --ink-2:#3A3733; --muted:#8C867E; --line:#ECE8E2; --line-2:#F3F0EC;
  --bg:#F8F6F3; --surface:#FFFFFF; --ok:#1F8A5B; --warn:#C2410C; --danger:#C0392B;
  --on-ink:#FFFFFF; --hover-line:var(--hover-line); --danger-50:var(--danger-50); --warn-50:var(--warn-50);
  --ph1:#FFF6EF; --ph2:#F6F2EC; --ph-icon:#F0C9AA; --soft:var(--soft); --tint:var(--tint);
  --sw-off:#DDD7CF; --header:rgba(255,255,255,.88); --empty-icon:#D6CFC6; --dash:#F5B98E;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(20,20,20,.04),0 6px 24px rgba(20,20,20,.05);
  --shadow-lg:0 10px 30px rgba(20,20,20,.08);
  color-scheme:light;
}
[data-theme="dark"]{
  --orange:#FF6A10; --orange-d:#FF8B40; --orange-50:#2A1910; --orange-100:#4A2913;
  --ink:#F4EFE9; --ink-2:#D2CBC2; --muted:#8F877D; --line:#2B2825; --line-2:#22201D;
  --bg:#0F0E0D; --surface:#181614; --ok:#3DBE84; --warn:#F28C4C; --danger:#E5675A;
  --on-ink:#141210; --hover-line:#3D3934; --danger-50:#3A1A17; --warn-50:#33200F;
  --ph1:#231B15; --ph2:#1A1816; --ph-icon:#6A4126; --soft:#1C1A18; --tint:#1F1712;
  --sw-off:#3A3632; --header:rgba(18,16,15,.86); --empty-icon:#3A3632; --dash:#7A421C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); --shadow-lg:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;overscroll-behavior-y:contain;transition:background .25s,color .25s}
button{-webkit-user-select:none;user-select:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{outline:none}
.hide{display:none!important}

/* Header */
header{position:sticky;top:0;z-index:20;background:var(--header);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:0 2px 10px rgba(255,102,0,.25)}
.brand b{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand b{font-size:20px}
html[data-noavisos] #rmBtn{display:none}
.seg{margin-left:auto;display:flex;background:var(--line-2);border-radius:999px;padding:4px}
.seg button{height:40px;padding:0 22px;border-radius:999px;font-weight:700;color:var(--muted);transition:.2s;display:flex;align-items:center;gap:8px}
.seg button.on{background:var(--ink);color:var(--on-ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.seg svg{width:16px;height:16px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--ok)}
.devbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s;flex:none}
.devbtn:hover{color:var(--ink);border-color:var(--hover-line)}
.devbtn svg{width:18px;height:18px}
.devtag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--on-ink);padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.devcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px}
.devcard h4{font-size:14px;font-weight:800;margin-bottom:4px}
.devcard p{color:var(--muted);font-size:13px;line-height:1.5}
.devkv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}
.devkv span{color:var(--muted)}
.devkv b{font-weight:700;text-align:right}
.prog{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .2s}
.proglbl{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.toggle.busy{opacity:.5;pointer-events:none}

main{max-width:1440px;margin:0 auto;padding:24px}

/* Generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:var(--r-sm);font-weight:700;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--orange);color:#fff}
.btn-p:hover{background:var(--orange-d)}
.btn-d{background:var(--ink);color:var(--on-ink)}
.btn-d:hover{filter:brightness(.88)}
.btn-g{background:var(--surface);border:1px solid var(--line)}
.btn-g:hover{border-color:var(--hover-line)}
.btn-t{color:var(--muted);height:32px;padding:0 10px}
.btn-t:hover{color:var(--ink);background:var(--line-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-50);color:var(--danger)}
.icon-btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{height:46px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;transition:.15s;width:100%}
.inp:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-50)}
.inp.err{border-color:var(--danger)}
.search{position:relative;flex:1;max-width:340px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .inp{padding-left:36px;padding-right:44px}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line-2);color:var(--ink-2)}
.search .clr:active{transform:translateY(-50%) scale(.92)}
.search .clr svg{position:static;transform:none;width:16px;height:16px;color:currentColor}
.search.voz .inp{padding-right:84px}
.search.voz .clr{right:46px}
.search .mic{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--orange-d);transition:.15s}
.search .mic svg{position:static;transform:none;width:19px;height:19px;color:currentColor}
.search .mic:active{transform:translateY(-50%) scale(.92)}
.search .mic.on{background:var(--orange);color:#fff;box-shadow:0 0 0 0 rgba(255,102,0,.5);animation:micpulse 1.2s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(255,102,0,.45)}70%{box-shadow:0 0 0 10px rgba(255,102,0,0)}100%{box-shadow:0 0 0 0 rgba(255,102,0,0)}}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty svg{width:40px;height:40px;color:var(--empty-icon);margin-bottom:10px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink-2);transition:.15s;display:flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--hover-line)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip small{font-size:11px;opacity:.55;font-weight:700}
.subchips{margin-top:10px}
.subchips .chip{height:34px;padding:0 13px;font-size:13px}
.subchips.sub2 .chip{height:32px;font-size:12.5px}
.subchips.sub2 .chip.on{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.subchips .chip.on{background:var(--orange-50);border-color:var(--orange);color:var(--orange-d)}
.secblk{border-bottom:1px solid var(--line)}
.secblk:last-of-type{border-bottom:0}
.secrow{background:var(--soft)}
.secrow .inp{font-weight:800}
.catrow.subrow{padding-left:44px}
.catrow.subrow .dot{width:6px;height:6px;opacity:.6}
.addsub{display:flex;gap:8px;padding:8px 14px 12px 40px}
.catrow.subrow.lv2{padding-left:76px}
.addsub.lv2{padding-left:72px}
.addsub .inp{height:38px}.addsub .btn{height:38px}

/* Venta */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.pos>section{min-width:0}
.pos-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;transition:.18s;position:relative;display:flex;flex-direction:column}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--hover-line)}
.pc:active{transform:scale(.98)}
.pc .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--ph1),var(--ph2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph svg{width:46px;height:46px;color:var(--ph-icon)}
.pc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.pc .nm{font-weight:700;line-height:1.25}
.pc .tc{font-style:italic;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.pc .pr{font-weight:800;font-size:15px}
.stk{font-size:11px;font-weight:700;color:var(--muted);background:var(--line-2);padding:3px 8px;border-radius:999px}
.stk.low{color:var(--warn);background:var(--warn-50)}
.stk.out{color:var(--danger);background:var(--danger-50)}
.lotb{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.incart{position:absolute;top:8px;right:8px;background:var(--ink);color:var(--on-ink);min-width:24px;height:24px;border-radius:999px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 7px}
.pc.dis{opacity:.5;pointer-events:none}

.cart{position:sticky;top:92px;display:flex;flex-direction:column;max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px)}
.cart-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.cart-h b{font-size:16px;font-weight:800}
.cart-list{overflow:auto;flex:1;padding:6px 0}
.cl{padding:12px 20px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;border-bottom:1px solid var(--line-2)}
.cl:last-child{border-bottom:0}
.cl .nm{font-weight:700;line-height:1.25}
.cl .meta{font-size:12px;color:var(--muted)}
.cl .lt{font-weight:800;text-align:right}
.cl .save{font-size:11px;color:var(--orange-d);font-weight:700}
.qty{display:flex;align-items:center;gap:2px;background:var(--line-2);border-radius:999px;padding:3px;width:max-content}
.qty button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qty button:hover{background:var(--surface)}
.qty button svg{width:14px;height:14px}
.qty span{min-width:32px;text-align:center;font-weight:800}
.cl-act{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.cart-f{padding:16px 20px 20px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.tot span{color:var(--muted);font-weight:600}
.tot b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.sell{width:100%;height:52px;font-size:15px;border-radius:12px}
.cart-empty{padding:48px 20px;text-align:center;color:var(--muted)}
.cart-empty svg{width:36px;height:36px;color:var(--empty-icon);margin-bottom:8px}
.mbar{display:none}

/* Gestión */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--orange)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{padding:16px 18px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
.pthumb{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--ph1),var(--ph2));overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb svg{width:20px;height:20px;color:var(--ph-icon)}
.pcell{display:flex;align-items:center;gap:12px}
.pcell .tc{font-style:italic;color:var(--muted);font-size:12px}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.tag.o{background:var(--orange-50);color:var(--orange-d)}
.num{font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.tbl-wrap{overflow-x:auto}

.catlist{max-width:620px}
.catrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.catrow:last-child{border-bottom:0}
.catrow .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.catrow .inp{height:36px;border-color:transparent;background:transparent;font-weight:600}
.catrow .inp:hover{border-color:var(--line)}
.catrow .inp:focus{background:var(--surface)}
.catrow small{color:var(--muted);font-weight:600;white-space:nowrap}
.addcat{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 var(--r) var(--r)}

.sale{padding:12px 18px;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:120px 1fr auto auto;gap:14px;align-items:center}
.sale:last-child{border-bottom:0}
.sale .d{color:var(--muted);font-size:12px;font-weight:600}
.sale .it{color:var(--ink-2);font-size:13px}
.sale b{font-weight:800}

/* Drawer / modal */
.ov{position:fixed;inset:0;background:rgba(20,20,20,.35);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);z-index:60;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden}
.drawer.on{transform:none;visibility:visible;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.dh{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dh b{font-size:18px;font-weight:800}
.db{padding:20px 24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.df{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;user-select:none}
.toggle b{font-weight:700;display:block}
.toggle small{color:var(--muted);font-size:12px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--sw-off);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--orange)}
.toggle.on .sw::after{left:21px}
.toggle.on{border-color:var(--orange-100);background:var(--tint)}
.sub-box{border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-sm) var(--r-sm);padding:14px 16px;margin-top:-17px;background:var(--tint)}
.toggle.on:has(+ .sub-box:not(.hide)){border-radius:var(--r-sm) var(--r-sm) 0 0}
.lotrow{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;align-items:end;margin-bottom:8px}
.lotrow .field label{font-size:11px}
.addlot{display:flex;align-items:center;gap:6px;color:var(--orange-d);font-weight:700;height:40px;padding:0 10px;border-radius:8px;border:1px dashed var(--dash)}
.addlot:hover{background:var(--orange-50)}
.addlot svg{width:14px;height:14px}
.lotdesc{font-size:12px;color:var(--muted);margin-top:4px}
.photo-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.photo-opts{grid-template-columns:1fr}}
.popt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;transition:.15s}
.popt:hover{border-color:var(--orange);background:var(--tint)}
.popt svg{width:20px;height:20px;color:var(--orange)}
.popt b{font-weight:700}
.popt small{font-size:11px;color:var(--muted)}
.ppreview{display:flex;gap:14px;align-items:center}
.ppreview img{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.web-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.wopt{aspect-ratio:4/3;border-radius:10px;border:2px solid var(--line);overflow:hidden;background:var(--ph2);position:relative;transition:.15s}
.wopt img{width:100%;height:100%;object-fit:cover}
.wopt:hover{border-color:var(--orange)}
.wopt.sk{animation:pulse 1.2s infinite ease-in-out;pointer-events:none}
@keyframes pulse{50%{opacity:.5}}
.note{font-size:11px;color:var(--muted);margin-top:8px}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(420px,calc(100vw - 32px));background:var(--surface);border-radius:18px;z-index:70;padding:24px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 30px 80px rgba(0,0,0,.2)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:6px}
.modal p{color:var(--ink-2);line-height:1.5}

.rmcount{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;font-style:normal;align-items:center;justify-content:center;border:2px solid var(--surface)}
.rmnew{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}
.rmquick{display:flex;flex-wrap:wrap;gap:8px}
.rmquick button{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.rmquick button:active{background:var(--orange-50);border-color:var(--orange);color:var(--orange-d)}
.sec-t .cnt{background:var(--line-2);color:var(--ink-2);padding:1px 7px;border-radius:999px;margin-left:4px;letter-spacing:0}
.rmrow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 16px;border-bottom:1px solid var(--line-2)}
.rmrow:last-child{border-bottom:0}
.rmwhen{display:flex;flex-direction:column}.rmwhen b{font-weight:800;font-size:13px}.rmwhen span{font-size:20px;font-weight:800;color:var(--orange-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rmtxt{font-weight:600;line-height:1.35;word-break:break-word}
.rmrow.due{background:var(--orange-50)}
.rmrow.donex{opacity:.55}.rmrow.donex .rmtxt{text-decoration:line-through}
.alarm{position:fixed;inset:0;z-index:100;background:rgba(15,14,13,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.alarm.on{opacity:1;pointer-events:auto}
.alarm-card{width:min(440px,calc(100vw - 32px));background:var(--surface);border-radius:24px;padding:28px 24px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:scale(.96);transition:.2s}
.alarm.on .alarm-card{transform:none}
.alarm-ic{width:72px;height:72px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:ring 1.2s ease-in-out infinite;box-shadow:0 0 0 10px var(--orange-50)}
.alarm-ic svg{width:36px;height:36px}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(9deg)}40%{transform:rotate(-6deg)}50%{transform:rotate(0)}}
.alarm-t{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--orange-d)}
.alarm-when{color:var(--muted);font-weight:600;margin-top:4px}
.alarm-txt{font-size:22px;font-weight:800;line-height:1.3;margin:14px 0 22px;word-break:break-word}
.alarm-acts{display:flex;gap:10px}.alarm-acts .btn{flex:1;height:52px}
@media (max-width:720px){ .rmrow{grid-template-columns:86px 1fr auto} .hwrap{gap:8px;padding:10px 12px} .brand img{width:38px;height:38px} .seg button{padding:0 11px;font-size:13px;gap:6px} .devbtn{width:40px;height:40px} }
</style>
</head>

/* ---------- Precio con lotes (combinación más barata) ---------- */
function priceFor(p, n){
  const unit = +p.price || 0;
  const lots = (p.lotsOn ? (p.lots||[]) : []).filter(l => l.qty > 1 && l.price > 0);
  if (!lots.length || n <= 0) return { total:r2(unit*n), parts:[], saved:0 };
  const cost=[0], pick=[null];
  for (let i=1;i<=n;i++){
    let best=cost[i-1]+unit, bp=null;
    for (const l of lots) if (l.qty<=i && cost[i-l.qty]+l.price < best-1e-9){ best=cost[i-l.qty]+l.price; bp=l; }
    cost[i]=best; pick[i]=bp;
  }
  const counts=new Map(); let i=n;
  while(i>0){ const l=pick[i]; if(l){ counts.set(l,(counts.get(l)||0)+1); i-=l.qty; } else i--; }
  return { total:r2(cost[n]), parts:[...counts].map(([l,c])=>({qty:l.qty,price:l.price,count:c})), saved:r2(unit*n-cost[n]) };
}

/* Desglose del precio: lotes + unidades sueltas */
function lotBreak(p, n){
  const pr=priceFor(p,n); if(!pr.parts.length) return {pr, short:'', long:''};
  const inLots=pr.parts.reduce((a,x)=>a+x.qty*x.count,0), loose=n-inLots;
  const short=pr.parts.map(x=>`${x.count>1?x.count+'× ':''}lote ${x.qty}`).join(' + ')+(loose?` + ${loose} ud${loose>1?'s':''}`:'');
  const long=pr.parts.map(x=>`${x.count>1?x.count+' × ':''}lote de ${x.qty} (${eur(x.price)})`).join(' + ')+(loose?` + ${loose} suelta${loose>1?'s':''} (${eur(loose*(+p.price||0))})`:'');
  return {pr, short, long};
}
/* Sugerencia: cuántas unidades faltan para que el cliente pague menos por unidad */
function lotNudge(p, n){
  if(!p.lotsOn) return null; const lots=(p.lots||[]).filter(l=>l.qty>1&&l.price>0); if(!lots.length) return null;
  const cur=priceFor(p,n).total, unit=+p.price||0, max=Math.max(...lots.map(l=>l.qty)), stock=+p.stock||0;
  for(let k=1;k<=max;k++){ if(n+k>stock) break; const extra=r2(priceFor(p,n+k).total-cur), normal=r2(unit*k);
    if(extra<normal-0.009){ const lq=Math.min(...lots.filter(l=>l.qty>=k).map(l=>l.qty).concat([max])); if(extra<=0.009 || k<=Math.max(2,Math.ceil(lq*0.4))) return {k, extra, save:r2(normal-extra)}; return null; } }
  return null;
}

const Store = {
  async put(col, obj){
    if (S.mode==='db'){ const {id,...rest}=obj; await S.db.collection(col).doc(id).set(rest); }
    else { const arr=S[colKey(col)]; const i=arr.findIndex(x=>x.id===obj.id); i>=0?arr[i]=obj:arr.push(obj); lsSave(); render(); }
  },
  async patch(col, id, data){
    if (S.mode==='db'){ await S.db.collection(col).doc(id).update(data); }
    else { const o=S[colKey(col)].find(x=>x.id===id); if(o) Object.assign(o,data); lsSave(); render(); }
  },
  async del(col, id){
    if (S.mode==='db'){ await S.db.collection(col).doc(id).delete(); }
    else { const k=colKey(col); S[k]=S[k].filter(x=>x.id!==id); lsSave(); render(); }
  }
};

function normSettings(raw){
  const d=DEF_SETTINGS(); let r={}; try{ r=raw?JSON.parse(JSON.stringify(raw)):{}; }catch(e){}
  const out={ cutoff:/^\d{2}:\d{2}$/.test(r.cutoff||'')?r.cutoff:d.cutoff, printOnClose:r.printOnClose!==false, webStock:!!r.webStock, ticket:{blocks:[]} };
  const rb=(r.ticket&&Array.isArray(r.ticket.blocks))?r.ticket.blocks:[]; const seen=new Set();
  for(const b of rb){ const def=d.ticket.blocks.find(x=>x.k===b.k); if(def&&!seen.has(b.k)){ out.ticket.blocks.push({...def,...b}); seen.add(b.k); } }
  for(const b of d.ticket.blocks) if(!seen.has(b.k)) out.ticket.blocks.push(b);
  return out;
}

async function boot(){
  let db=null;
  try{ if (window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){ db=null; }
  if (db){
    S.mode='db'; S.db=db;
    const got={categories:false,products:false,sales:false};
    const timer=setTimeout(()=>{ setSync('Sin conexión, reintentando…',false); if(!S.ready){S.ready=true;render();} },10000);
    const done=()=>{ if(got.categories&&got.products&&got.sales){ clearTimeout(timer); S.ready=true; setSync('Sincronizado',true); render(); migrateAll(); } };
    const map = snap => snap.docs.map(d=>({id:d.id,...d.data()}));
    db.collection('categories').onSnapshot(s=>{ S.cats=map(s).sort((a,b)=>(a.order??0)-(b.order??0)); if(!s.metadata.fromCache) got.categories=true; S.ready?render():done(); }, onErr);
    db.collection('products').onSnapshot(s=>{ S.products=map(s); if(!s.metadata.fromCache) got.products=true; S.ready?render():done(); }, onErr);
    db.collection('sales').orderBy('ts','desc').limit(400).onSnapshot(s=>{ S.sales=map(s); if(!s.metadata.fromCache) got.sales=true; if(U.view==='conta'&&U.acc.mode!=='hoy') schedAcc(); S.ready?render():done(); }, onErr);
    db.collection('closures').orderBy('ts','desc').limit(400).onSnapshot(s=>{ S.closures=map(s); render(); }, ()=>{});
    db.collection('reminders').onSnapshot(s=>{ S.reminders=map(s); rmBadge(); if(RM.open) drawReminders(); rmCheck(); }, ()=>{});
    db.doc('settings/main').onSnapshot(d=>{ if(setT) return; S.settings=normSettings(d.exists?d.data():null); render(); if(DEV.open&&DEV.tab!=='ticket'&&!DEV.busy) drawDev(); }, ()=>{});
  } else {
    S.mode='local'; Object.assign(S, lsLoad()); S.settings=normSettings(S.settings); S.closures=S.closures||[]; S.reminders=S.reminders||[]; S.ready=true;
    setSync('Guardado en este navegador',false); render(); migrateAll();
  }
}

/* Secciones (sin padre) y subsecciones (parent = id de la sección) */
const byOrder = (a,b)=>(a.order??0)-(b.order??0);
const catById = id => S.cats.find(c=>c.id===id);
const secList = () => S.cats.filter(c=>!c.parent).sort(byOrder);
const subsOf = id => S.cats.filter(c=>c.parent===id).sort(byOrder);
const parentsOf = id => { const out=[]; let c=catById(id), n=0; while(c&&c.parent&&n++<10){ out.push(c.parent); c=catById(c.parent); } return out; };
const secOf = id => { const a=parentsOf(id); return a.length?a[a.length-1]:id; };
const catPath = id => [...parentsOf(id).reverse(), id].map(catById).filter(Boolean);
const inCat = (p,id) => p.catId===id || parentsOf(p.catId).includes(id);
const catName = id => { const pa=catPath(id); return pa.length?pa.map(c=>c.name).join(' · '):'Sin categoría'; };
const countIn = id => S.products.filter(p=>inCat(p,id)).length;
const catOrderKey = id => { const pa=catPath(id); return pa.length?pa.map(c=>(c.order??0)+1):[999]; };
const cmpKey = (x,y) => { for(let i=0;i<Math.max(x.length,y.length);i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d; } return 0; };
/* Paso único a la estructura nueva: 6 secciones y las categorías antiguas de peces dentro de «Peces» */
let catMigrando=false;
async function migrateCats(){
  if(catMigrando||!S.ready||S.cats.some(c=>c.sec)) return; catMigrando=true;
  const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  try{
    const old=S.cats.slice().sort(byOrder), secIds={};
    for(let i=0;i<SECCIONES.length;i++){ const n=SECCIONES[i], ex=old.find(c=>!c.parent&&norm(c.name)===norm(n));
      if(ex){ secIds[n]=ex.id; await Store.patch('categories',ex.id,{sec:true,order:i,name:n}); }
      else { const id=uid(); secIds[n]=id; await Store.put('categories',{id,name:n,order:i,sec:true}); } }
    const usados=new Set(Object.values(secIds)); let k=0;
    for(const c of old){ if(usados.has(c.id)||c.parent) continue; await Store.patch('categories',c.id,{parent:secIds['Peces'],order:k++}); }
  }catch(e){} finally{ catMigrando=false; }
}
/* Paso único: Bettas › Machos / Hembras › Genéricos / Selección / Variedad */
let bettaMigrando=false;
async function migrateBettas(){
  const be=secList().find(c=>normTx(c.name)==='bettas'); if(bettaMigrando||!S.ready||!be||be.v3) return; bettaMigrando=true;
  try{
    const ids={};
    for(let i=0;i<BETTA_SEXOS.length;i++){ const sx=BETTA_SEXOS[i]; let c=subsOf(be.id).find(x=>normTx(x.name)===normTx(sx));
      if(!c){ c={id:uid(),name:sx,order:i,parent:be.id}; await Store.put('categories',c); }
      ids[sx]={};
      for(let j=0;j<BETTA_LINEAS.length;j++){ const ln=BETTA_LINEAS[j]; let d=subsOf(c.id).find(x=>normTx(x.name)===normTx(ln));
        if(!d){ d={id:uid(),name:ln,order:j,parent:c.id}; await Store.put('categories',d); } ids[sx][normTx(ln)]=d.id; } }
    /* Las antiguas Bettas › Variedad / Selección / Genéricos pasan a Machos o Hembras según el nombre del producto */
    for(const old of subsOf(be.id)){ const k=normTx(old.name); if(!ids.Machos[k]||subsOf(old.id).length) continue;
      for(const pr of S.products.filter(x=>x.catId===old.id)) await Store.patch('products',pr.id,{catId:ids[/hembra/i.test(pr.name)?'Hembras':'Machos'][k]});
      await Store.del('categories',old.id); }
    let k=0; for(const c of subsOf(be.id)) if(!BETTA_SEXOS.includes(c.name)) await Store.patch('categories',c.id,{order:2+k++});
    await Store.patch('categories',be.id,{v3:true});
  }catch(e){} finally{ bettaMigrando=false; }
}

/* Búsqueda: sin tildes ni mayúsculas y con todas las palabras (sirve también para lo dictado) */
function matchQ(p,q){ if(!q) return true; const t=normTx(p.name+' '+(p.tech||'')); return normTx(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w)); }
/* ---------- Búsqueda por voz ---------- */
const VOZ={on:false,rec:null};
const vozPlugin=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition;
function vozPoner(t){ t=String(t||'').trim().replace(/[.,;:!?¿¡]+/g,''); if(!t) return; U.q=t; render(); }
function vozParar(){ try{ VOZ.rec&&VOZ.rec.stop(); }catch(e){} try{ const SR=vozPlugin(); SR&&SR.stop(); }catch(e){} }
async function vozBuscar(){
  if(VOZ.on) return vozParar();
  const SR=vozPlugin();
  if(enApp()&&SR){
    try{
      const av=await SR.available(); if(!av||!av.available) return toast('El reconocimiento de voz no está disponible en esta tablet');
      let pm=await SR.checkPermissions(); if(pm.speechRecognition!=='granted') pm=await SR.requestPermissions();
      if(pm.speechRecognition!=='granted') return toast('Hay que permitir el micrófono');
      VOZ.on=true; render();
      const r=await SR.start({language:'es-ES',maxResults:3,prompt:'Di el nombre del producto',partialResults:false,popup:true});
      vozPoner(r&&r.matches&&r.matches[0]);
    }catch(e){ if(!/cancel|match|no se/i.test(String(e&&e.message||e))) toast('No te he entendido. Prueba otra vez'); }
    finally{ VOZ.on=false; render(); }
    return;
  }
  const W=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!W) return toast('La búsqueda por voz no está disponible aquí');
  const rec=new W(); rec.lang='es-ES'; rec.interimResults=true; rec.maxAlternatives=1; VOZ.rec=rec; VOZ.on=true; render();
  rec.onresult=e=>vozPoner([...e.results].map(r=>r[0].transcript).join(''));
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Hay que permitir el micrófono'); else if(e.error!=='no-speech'&&e.error!=='aborted') toast('No te he entendido. Prueba otra vez'); };
  rec.onend=()=>{ VOZ.on=false; VOZ.rec=null; render(); };
  try{ rec.start(); }catch(e){ VOZ.on=false; VOZ.rec=null; render(); }
}

function addToCart(id){
  const p=S.products.find(x=>x.id===id); if(!p) return;
  const l=U.cart.find(x=>x.id===id); const cur=l?l.qty:0;
  if (cur>=(+p.stock||0)) return toast('No hay más stock de '+p.name);
  l ? l.qty++ : U.cart.push({id,qty:1}); render();
}
function chg(id,d){ const l=U.cart.find(x=>x.id===id); const p=S.products.find(x=>x.id===id); if(!l) return; d=+d;
  if(l.custom){ l.qty+=d; if(l.qty<=0) U.cart=U.cart.filter(x=>x!==l); render(); return; }
  l.qty+=d; if(d>0 && l.qty>(+p.stock||0)){ l.qty=+p.stock; toast('Stock máximo alcanzado'); }
  if(l.qty<=0) U.cart=U.cart.filter(x=>x!==l); render(); }
function rm(id){ U.cart=U.cart.filter(x=>x.id!==id); render(); }

let selling=false;
async function confirmSale(){
  if (selling || !U.cart.length) return; selling=true;
  const btn=$('#sellBtn'); if(btn) btn.disabled=true;
  try{
    const items=[];
    for (const l of U.cart){
      if(l.custom){ items.push({pid:null,name:l.custom.name||'',qty:l.qty,unit:l.custom.price,total:r2(l.qty*l.custom.price),saved:0,manual:true}); continue; }
      const p=S.products.find(x=>x.id===l.id); if(!p) continue;
      const pr=priceFor(p,l.qty);
      items.push({pid:p.id,name:p.name,qty:l.qty,unit:+p.price||0,total:pr.total,saved:pr.saved||0,lots:lotBreak(p,l.qty).short});
      await Store.patch('products', p.id, {stock: Math.max(0,(+p.stock||0)-l.qty)});
    }
    const total=r2(items.reduce((a,i)=>a+i.total,0));
    const ts=Date.now(), sale={id:uid(),ts,no:ticketNo(ts),items,total};
    await Store.put('sales',sale);
    U.cart=[]; U.cartOpen=false; render();
    if(PR.autoPrint && PR.status==='on'){ toast('Venta registrada · imprimiendo ticket'); printReceipt(sale); }
    else toast('Venta registrada · '+eur(total)+(PR.autoPrint?' · impresora sin conectar':''));
  }catch(e){ toast('No se pudo registrar la venta'); }
  selling=false; render();
}

async function addCat(parent){
  const el=$(parent?'#newsub-'+parent:'#newcat'); const n=el.value.trim(); if(!n) return el.focus();
  const sib=parent?subsOf(parent):secList();
  if (sib.some(c=>c.name.toLowerCase()===n.toLowerCase())) return toast(parent?'Esa subsección ya existe':'Esa sección ya existe');
  const order=sib.length?Math.max(...sib.map(c=>c.order??0))+1:0;
  const doc=parent?{id:uid(),name:n,order,parent}:{id:uid(),name:n,order,sec:true};
  el.value=''; await safe(()=>Store.put('categories',doc)); toast(parent?'Subsección añadida':'Sección añadida');
}
async function renameCat(id,v){ v=v.trim(); if(!v) return render(); await safe(()=>Store.patch('categories',id,{name:v})); toast('Nombre actualizado'); }
async function moveCat(id,d){
  const c=catById(id); if(!c) return; const sib=c.parent?subsOf(c.parent):secList();
  const i=sib.findIndex(x=>x.id===id), j=i+d; if(j<0||j>=sib.length) return;
  const arr=sib.slice(); [arr[i],arr[j]]=[arr[j],arr[i]];
  await safe(async()=>{ for(let k=0;k<arr.length;k++) if((arr[k].order??-1)!==k) await Store.patch('categories',arr[k].id,{order:k}); });
}
async function seedCats(){ await safe(async()=>{ for (const c of defaultCats()) await Store.put('categories',c); }); }
function askDelCat(id){
  const n=countIn(id), c=catById(id), subs=subsOf(id), tipo=c.parent?'subsección':'sección';
  if (n) return modal('No se puede eliminar',`«${esc(c.name)}» tiene ${n} producto(s). Muévelos a otra sección o elimínalos antes.`,null);
  if (subs.length) return modal('No se puede eliminar',`«${esc(c.name)}» tiene ${subs.length} subsección(es). Elimínalas antes.`,null);
  modal('Eliminar '+tipo,`¿Seguro que quieres eliminar la ${tipo} «${esc(c.name)}»?`,async()=>{ await safe(()=>Store.del('categories',id)); if([U.cat,U.sub,U.sub2].includes(id)){U.cat='all';U.sub='all';U.sub2='all';} if(U.gcat===id) U.gcat='all'; toast(tipo.charAt(0).toUpperCase()+tipo.slice(1)+' eliminada'); });
}
function askDelProduct(id){ const p=S.products.find(x=>x.id===id);
  modal('Eliminar producto',`¿Eliminar «${esc(p.name)}» del inventario? Esta acción no se puede deshacer.`,async()=>{ await safe(()=>Store.del('products',id)); toast('Producto eliminado'); }); }
function askDelSale(id){ const s=findSale(id); if(!s) return;
  modal('Anular venta',`Se eliminará la venta de ${eur(s.total)} y se devolverán las unidades al stock.`,async()=>{
    await safe(async()=>{ for(const it of (s.items||[])){ const p=S.products.find(x=>x.id===it.pid); if(p) await Store.patch('products',p.id,{stock:(+p.stock||0)+it.qty}); } await Store.del('sales',id); });
    if(U.acc.sales) U.acc.sales=U.acc.sales.filter(x=>x.id!==id); render();

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const M=640; let w=im.naturalWidth,h=im.naturalHeight; const k=Math.min(1,M/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.78)); };
    im.onerror=rej; im.src=url;
  });
}

let sampleFn;
async function webSearch(){
  const term=(F.name||'').trim(); const tech=(F.tech||'').trim();
  if(!term && !tech){ toast('Escribe primero el nombre del pez'); $('#f-name')&&$('#f-name').focus(); return; }
  F.web={loading:true,term:term||tech}; drawDrawer();
  try{
    if (sampleFn===undefined) sampleFn = (window.claude&&window.claude.use) ? await window.claude.use('sample') : null;
    if (!sampleFn) throw {code:'not_granted'};
    const prompt = `Eres ilustrador para una tienda de acuariofilia. Crea 4 ilustraciones SVG distintas, bonitas y realistas en lo posible, del animal acuático "${term}"${tech?` (nombre científico: ${tech})`:''}, fieles a su forma, aletas y colores reales.
Requisitos de cada SVG: viewBox="0 0 400 300", sin texto, sin scripts, sin imágenes externas, fondo de acuario suave (degradado) y el animal centrado y grande, con degradados para dar volumen. Varía el ángulo, el fondo y el estilo entre las 4 (por ejemplo: perfil clásico, fondo oscuro elegante, plantas acuáticas, estilo minimalista). Máximo 5000 caracteres por SVG.
Responde SOLO con JSON: {"options":["<svg ...>...</svg>","<svg ...>","<svg ...>","<svg ...>"]}`;
    const out = await sampleFn.json(prompt,{modelTier:'default', cache:false});
    const opts=((out&&out.options)||[]).map(s=>String(s||'').trim()).filter(s=>/^<svg[\s>]/i.test(s)&&s.length<60000)
      .map(s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s.replace(/<script[\s\S]*?<\/script>/gi,'')));
    if(!F||!F.web) return;
    if(!opts.length) throw {code:'empty'};
    F.web={term:F.web.term,opts:opts.slice(0,4)};
  }catch(e){
    if(!F) return;
    F.web={term:term||tech,error: e&&e.code==='not_granted' ? 'La búsqueda en línea necesita tu permiso. Ábrela desde la página de la app en Claude y acepta cuando te lo pida.' : e&&e.code==='rate_limited' ? 'Demasiadas búsquedas seguidas. Espera un momento y vuelve a probar.' : 'No se encontraron opciones. Prueba de nuevo o añade una foto desde el dispositivo.'};
  }
  drawDrawer();
}

}

/* Rellena las fotos de los productos de prueba cargados antes de la v0.1.17 */
let demoFixDone=false;
async function fixDemoPhotos(){
  if(demoFixDone||!S.ready) return; const pkById={}; DEMO.products.forEach(p=>{ if(p.pk) pkById[p.id]=p.pk; });
  const todo=S.products.filter(p=>p.demo&&!p.photo&&pkById[p.id]&&DEMO_PHOTOS[pkById[p.id]]); if(!todo.length) return;
  demoFixDone=true;
  if(S.mode==='local'){ todo.forEach(p=>p.photo=DEMO_PHOTOS[pkById[p.id]]); lsSave(); render(); toast('Fotos de prueba añadidas'); return; }
  toast('Añadiendo fotos a los productos de prueba…');
  try{ for(const p of todo){ await withRetry(()=>Store.patch('products',p.id,{photo:DEMO_PHOTOS[pkById[p.id]]})); } toast(`Fotos añadidas a ${todo.length} productos`); }

async function webGet(url){
  const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  try{
    if(enApp()&&H){ const r=await H.get({url,headers:{Accept:'application/json'},responseType:'json'});
      if(r.status!==200) throw new Error('http '+r.status); return typeof r.data==='string'?JSON.parse(r.data):r.data; }
    const r=await fetch(url,{headers:{Accept:'application/json'}}); if(!r.ok) throw new Error('http '+r.status); return await r.json();
  }catch(e){ throw webErr(enApp()?'No se pudo conectar con bettarea.es. Comprueba la conexión a internet.':'Desde aquí no se puede leer la web. Usa la app de Android.'); }
}

}

  if(!Object.keys(C).length) throw webErr('La web no ha devuelto secciones');
  let all=[];
  for(let pg=1;pg<=30;pg++){ DEV.label=`Descargando productos de la web… (página ${pg})`; updProg();
    const j=await webGet(WEB_API+`products?per_page=100&page=${pg}`); if(!Array.isArray(j)||!j.length) break; all=all.concat(j); if(j.length<100) break; }
  if(!all.length) throw webErr('La web no ha devuelto productos');
  const TOP={'bettas':'Bettas','peces':'Peces','plantas':'Plantas','plantas-naturales':'Plantas','alimentacion-peces':'Alimentación','alimentacion':'Alimentación','equipo-accesorios':'Equipo y Accesorios','equipo-y-accesorios':'Equipo y Accesorios'};
  const topName=c=>TOP[c.slug]||({'bettas':'Bettas','peces':'Peces','plantas naturales':'Plantas','plantas':'Plantas','alimentacion':'Alimentación','equipo y accesorios':'Equipo y Accesorios'})[normTx(c.name)];
  const pathOf=id=>{ const p=[]; let k=id, n=0; while(C[k]&&n++<10){ p.unshift(C[k]); k=C[k].parent; } return p; };
  const plan=[];
  for(const p of all){
    const paths=(p.categories||[]).map(c=>pathOf(c.id)).filter(pa=>pa.length&&pa[0].slug!=='betta-world'&&topName(pa[0]));
    if(!paths.length) continue; paths.sort((a,b)=>b.length-a.length); const pa=paths[0];
    let sec=topName(pa[0]), sub=[]; const nm=decHtml(p.name);
    if(pa.some(c=>c.slug==='invertebrados'||normTx(c.name)==='invertebrados')) sec='Invertebrados';
    else if(sec==='Bettas'){ const sxN=pa.find(c=>/^(machos|hembras)$/.test(normTx(c.name)));
      const sx=sxN?(normTx(sxN.name)==='hembras'?'Hembras':'Machos'):(/hembra/i.test(nm)?'Hembras':'Machos');
      sub=[sx]; if(pa[1]&&!/^(machos|hembras)$/.test(normTx(pa[1].name))) sub.push(decHtml(pa[1].name)); }
    else if(pa[1]) sub=[decHtml(pa[1].name)];
    const im=(p.images||[])[0]||{}, minor=(p.prices&&p.prices.currency_minor_unit!=null)?+p.prices.currency_minor_unit:2;
    plan.push({webId:p.id, name:nm, price:r2((+((p.prices||{}).price)||0)/Math.pow(10,minor)), photo:im.thumbnail||im.src||'', sec, sub});
  }
  DEV.label='Preparando secciones…'; updProg();
  const secIds={}, subIds={};
  for(const x of plan){ if(!secIds[x.sec]) secIds[x.sec]=await webSection(x.sec); let par=secIds[x.sec], k=x.sec;
    for(const n of x.sub){ k+='|'+n; if(!subIds[k]) subIds[k]=await webSub(par,n); par=subIds[k]; } x.catId=par; }
  const on=!!S.settings.webStock, byWeb={}; S.products.forEach(p=>{ if(p.webId) byWeb[p.webId]=p; });
  const docs=plan.map(x=>{ const inv=webInv(x.webId,x.sec), catId=x.catId, ex=byWeb[x.webId];
    return ex ? {...ex, name:x.name, price:x.price, photo:x.photo||ex.photo, catId, webStock:inv, web:true}
              : { id:'w'+x.webId, webId:x.webId, web:true, catId, name:x.name, tech:'', stock:on?inv:0, webStock:inv, price:x.price, lotsOn:false, lots:[], date:today(), photo:x.photo }; });
  DEV.label='Guardando productos…'; DEV.total=docs.length; DEV.done=0; updProg();
  if(S.mode==='local'){ const idx={}; S.products.forEach((p,i)=>idx[p.id]=i); docs.forEach(d=>{ if(idx[d.id]!=null) S.products[idx[d.id]]=d; else S.products.push(d); }); DEV.done=docs.length; lsSave(); render(); }
  else for(const d of docs){ await withRetry(()=>Store.put('products',d)); step(); }
  WEB_LAST=docs.length;
}

async function loadDemo(){
  const map={};
  if (S.mode==='local'){
    for (const c of DEMO.cats){ const ex=S.cats.find(x=>x.name.toLowerCase()===c.name.toLowerCase()&&!!x.parent===!!c.parent); if(ex) map[c.id]=ex.id; else { const n={...c}; if(c.parent) n.parent=map[c.parent]||c.parent; S.cats.push(n); map[c.id]=c.id; } }
    S.products = S.products.filter(p=>!p.demo).concat(DEMO.products.map(p=>({...dp(p),catId:map[p.catId]||p.catId})));
    lsSave(); render(); return;
  }
  const missing=DEMO.cats.filter(c=>{ const ex=S.cats.find(x=>x.name.toLowerCase()===c.name.toLowerCase()&&!!x.parent===!!c.parent); if(ex){ map[c.id]=ex.id; return false; } map[c.id]=c.id; return true; });
  DEV.total=missing.length+DEMO.products.length; updProg();
  for (const c of missing){ const n={...c}; if(c.parent) n.parent=map[c.parent]||c.parent; await withRetry(()=>Store.put('categories',n)); step(); }
  for (const p of DEMO.products){ await withRetry(()=>Store.put('products',{...dp(p),catId:map[p.catId]})); step(); }
}

function accRange(){
  const a=U.acc;
  if(a.mode==='hoy'){ return {from:shiftStart(), to:Infinity, label:'Turno actual · '+fdate(bizDate(Date.now()))}; }
  if(a.mode==='dia') return {from:bizStart(a.day), to:bizEnd(a.day), label:fdate(a.day)};
  if(a.mode==='rango'){ let f=a.from,t=a.to; if(f>t)[f,t]=[t,f]; return {from:bizStart(f), to:bizEnd(t), label:`${fdate(f)} – ${fdate(t)}`}; }
  if(a.mode==='mes'){ const [y,m]=a.month.split('-').map(Number); const t=ymd(new Date(y,m,0)); const lb=new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}); return {from:bizStart(a.month+'-01'), to:bizEnd(t), label:lb.charAt(0).toUpperCase()+lb.slice(1)}; }
  const y=+a.year; return {from:bizStart(`${y}-01-01`), to:bizEnd(`${y}-12-31`), label:'Año '+y};
}
function accSales(){
  const a=U.acc;
  if(a.mode==='hoy') return shiftSales();
  if(S.mode==='local'){ const r=accRange(); return S.sales.filter(s=>s.ts>=r.from&&s.ts<r.to).sort((x,y)=>y.ts-x.ts); }
  return a.sales||[];
}
async function loadAcc(){
  const a=U.acc; if(a.mode==='hoy'||S.mode!=='db') { render(); return; }
  const r=accRange(); const key=a.mode+':'+r.from+'-'+r.to; a.key=key; a.loading=true; render();
  try{
    let out=[], last=null;
    for(let i=0;i<25;i++){
      const q=S.db.collection('sales').where('ts','>=',r.from).where('ts','<',last??r.to).orderBy('ts','desc').limit(1000);
      const snap=await withRetry(()=>q.get());
      const docs=snap.docs.map(d=>({id:d.id,...d.data()})); out=out.concat(docs);
      if(docs.length<1000) break; last=docs[docs.length-1].ts;
    }
    if(a.key!==key) return; a.sales=out;
  }catch(e){ if(a.key===key){ a.sales=[]; toast('No se pudieron cargar las ventas'); } }
  if(a.key===key){ a.loading=false; render(); }
}

const imgCache=new Map(), monoCache=new Map();
function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }

let fontsOk=null;
function fontsReady(){ if(!fontsOk) fontsOk=Promise.all([document.fonts.load('700 30px Caveat'),document.fonts.load('600 20px Manrope')]).catch(()=>{}); return fontsOk; }
const CW=12, CH=24;                                   // letra A de la impresora: 12 × 24 puntos
const dotsW = p => (p==80?576:384);                   // ancho imprimible: 72 mm (80) / 48 mm (58)
const colsOf = p => Math.floor(dotsW(p)/CW);          // 48 columnas (80 mm) / 32 columnas (58 mm)
const TK_W = 384;                                     // (compatibilidad)
function magOf(s){ s=+s||20; return s<=21?[1,1]:s<=27?[1,2]:s<=40?[2,2]:[3,3]; }
const plain = s => String(s??'').replace(/[  ]/g,' ').replace(/−/g,'-').replace(/×/g,'x');
function wrapCols(text, n){
  const out=[];
  for(const para of plain(text).split('\n')){
    const words=para.split(/\s+/).filter(Boolean); let line='';
    if(!words.length){ out.push(''); continue; }
    for(let w of words){ while(w.length>n){ if(line){ out.push(line); line=''; } out.push(w.slice(0,n)); w=w.slice(n); }
      const t=line?line+' '+w:w; if(t.length<=n) line=t; else { out.push(line); line=w; } }
    if(line) out.push(line);
  }
  return out;
}
function lrText(l, r, n){ l=plain(l); r=plain(r); const room=n-r.length-1; if(room<1) return [l.slice(0,n), r.slice(0,n)];
  const ls=wrapCols(l, room); const last=ls.pop()||''; return [...ls, last+' '.repeat(Math.max(1,n-last.length-r.length))+r]; }

/* Imágenes en blanco y negro (logo y frase a mano), al ancho de la impresora */
function monoCanvas(src, w, h, dither){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(src,0,0);
  const d=x.getImageData(0,0,w,h), p=d.data, g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){ const l=p[i*4]*0.299+p[i*4+1]*0.587+p[i*4+2]*0.114; g[i]=dither?Math.max(0,Math.min(255,(l-60)/(185-60)*255)):(l<160?0:255); }
  if(dither) for(let yy=0;yy<h;yy++) for(let xx=0;xx<w;xx++){ const i=yy*w+xx, o=g[i], n=o<128?0:255, e=o-n; g[i]=n;
    if(xx+1<w) g[i+1]+=e*7/16; if(yy+1<h){ if(xx>0) g[i+w-1]+=e*3/16; g[i+w]+=e*5/16; if(xx+1<w) g[i+w+1]+=e/16; } }
  for(let i=0;i<w*h;i++){ const v=g[i]<128?0:255; p[i*4]=p[i*4+1]=p[i*4+2]=v; p[i*4+3]=255; }
  x.putImageData(d,0,0); return c;
}
async function logoImage(b, paper){
  const W=dotsW(paper), src=b.img||TICKET_LOGO, key=src.length+src.slice(-30)+b.size+b.align+W; if(monoCache.has(key)) return monoCache.get(key);
  let im=null; try{ im=await getImg(src); }catch(e){ return null; }
  const w=Math.round(W*Math.min(100,Math.max(15,+b.size||60))/100*0.92), h=Math.round(w*im.naturalHeight/im.naturalWidth);
  const x0=b.align==='left'?0:b.align==='right'?W-w:Math.round((W-w)/2);
  const c=document.createElement('canvas'); c.width=W; c.height=h+8; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,W,h+8); x.drawImage(im,x0,4,w,h);
  const out=monoCanvas(c,W,h+8,true); monoCache.set(key,out); return out;
}
function handImage(b, paper){
  const W=dotsW(paper), s=Math.round((+b.size||40)*W/384), f=`700 ${s}px Caveat, 'Segoe Print', 'Comic Sans MS', cursive`;
  const m=document.createElement('canvas').getContext('2d'); m.font=f;
  const lines=wrapCols(b.text||'', Math.max(8,Math.floor(W/(s*0.42)))).filter(Boolean); if(!lines.length) return null;
  const H=Math.round(lines.length*s*1.02+s*0.45);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.fillStyle='#000'; x.textBaseline='top'; x.font=f;
  const ax=b.align==='left'?8:b.align==='right'?W-8:W/2; x.textAlign=b.align||'center';
  let y=0, lastW=0, lastY=0; for(const ln of lines){ x.fillText(ln,ax,y); lastW=m.measureText(ln).width; lastY=y; y+=s*1.02; }
  const x0=b.align==='left'?8:b.align==='right'?W-8-lastW:W/2-lastW/2, uy=lastY+s*0.95, lw=Math.max(3,s*0.075);
  const xa=Math.max(4,x0-s*0.12), xb=Math.min(W-4,x0+lastW+s*0.22);
  x.strokeStyle='#000'; x.lineCap='round'; x.lineWidth=lw; x.beginPath(); x.moveTo(xa,uy+s*0.05);
  x.bezierCurveTo(xa+(xb-xa)*0.3,uy-s*0.07,xa+(xb-xa)*0.62,uy+s*0.11,xb,uy-s*0.1); x.stroke();
  x.lineWidth=lw*0.6; x.beginPath(); x.moveTo(xa+(xb-xa)*0.16,uy+s*0.2); x.quadraticCurveTo(xa+(xb-xa)*0.55,uy+s*0.06,xa+(xb-xa)*0.9,uy+s*0.15); x.stroke();
  return monoCanvas(c,W,H,false);
}

/* Líneas de cada sección del ticket */
async function blockLines(b, data, paper){
  const N=colsOf(paper), L=[], s=+b.size||20, [mw,mh]=magOf(s);
  const T=(t,o={})=>L.push({t:plain(t), align:o.align||'left', w:o.w||1, h:o.h||1, bold:!!o.bold});
  const wrapT=(t,o={})=>{ const w=o.w||1; for(const ln of wrapCols(t, Math.floor(N/w))) T(ln,o); };
  const LR=(l,r,o={})=>{ const w=o.w||1; for(const ln of lrText(l,r,Math.floor(N/w))) T(ln,{...o,align:'left'}); };
  const SEP=()=>T('-'.repeat(N));
  if(b.k==='logo'){ const c=await logoImage(b,paper); if(c) L.push({img:c}); }
  else if(b.k==='hand'){ const c=handImage(b,paper); if(c) L.push({img:c}); }
  else if(b.k==='store') wrapT(b.text||'', {align:b.align, w:mw, h:mh, bold:true});
  else if(b.k==='thanks'||b.k==='custom') wrapT(b.text||'', {align:b.align, w:mw, h:mh, bold:b.k==='thanks'});
  else if(b.k==='info'){
    const d=new Date(data.ts||Date.now()), ds=d.toLocaleDateString('es-ES')+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    if(data.title) wrapT(data.title,{align:b.align, w:1, h:2, bold:true});
    if(data.label) wrapT(data.label,{align:b.align, w:mw, h:mh});
    if(b.align==='left' && data.no){ const nn='N. '+data.no; if(ds.length+nn.length+1<=Math.floor(N/mw)) LR(ds,nn,{w:mw,h:mh}); else { T(ds,{w:mw,h:mh}); T(nn,{w:mw,h:mh,align:'right'}); } }
    else { wrapT(ds,{align:b.align,w:mw,h:mh}); if(data.no) wrapT('Ticket N. '+data.no,{align:b.align,w:mw,h:mh}); }
    SEP();
  } else if(b.k==='items'){
    if(data.kind==='report') for(const it of data.items) LR(`${it.name} (${it.qty})`, eur(it.total), {w:mw,h:mh});
    else for(const it of data.items){
      const unit=it.unit!=null?+it.unit:(it.qty?it.total/it.qty:0);
      if(it.name){ wrapT(it.name,{w:mw,h:mh,bold:true}); LR(`  ${it.qty} x ${eur(unit)}`, eur(it.total), {w:mw,h:mh}); }
      else LR(`${it.qty} x ${eur(unit)}`, eur(it.total), {w:mw,h:mh,bold:true});
      if(+it.saved>0) LR(`  Oferta ${it.lots||'lote'}`, '-'+eur(it.saved));
    }
    SEP();
  } else if(b.k==='total'){
    LR('TOTAL', eur(data.total), {w:mw,h:mh,bold:true});
    const u=(data.items||[]).reduce((a,i)=>a+(+i.qty||0),0);
    T(data.count!=null?`${data.count} venta${data.count===1?'':'s'} · ${u} uds`:`${u} artículo${u===1?'':'s'} · IVA incluido`);
  }
  return L;
}
function ticketBlocks(data){ return S.settings.ticket.blocks.filter(b=>b.on!==false && !(data.kind==='report' && (b.k==='thanks'||b.k==='custom'||b.k==='hand'))); }

/* Vista previa: dibuja las líneas con la letra de la impresora (rejilla de 12 × 24 puntos) */
function drawLines(L, paper, scale){
  const W=dotsW(paper); let H=6; for(const l of L) H+= l.img? l.img.height : CH*l.h; H+=6;
  const c=document.createElement('canvas'); c.width=Math.round(W*scale); c.height=Math.round(H*scale);
  const x=c.getContext('2d'); x.scale(scale,scale); x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.fillStyle='#000'; x.textBaseline='top';
  let y=3;
  for(const l of L){
    if(l.img){ x.imageSmoothingEnabled=false; x.drawImage(l.img,0,y); y+=l.img.height; continue; }
    const n=Math.floor(W/(CW*l.w)), t=l.t.slice(0,n), tw=t.length*CW*l.w;
    const x0=l.align==='center'?Math.floor((W-tw)/2/CW)*CW:l.align==='right'?W-tw:0;
    x.save(); x.translate(x0,y); x.scale(l.w,l.h); x.font=`${l.bold?'800':'600'} 20px "Courier New", Courier, monospace`;
    for(let i=0;i<t.length;i++) x.fillText(t[i], i*CW+0.5, 2);
    x.restore(); y+=CH*l.h;
  }
  return c;
}
async function renderBlock(b, data, scale){ await fontsReady(); return drawLines(await blockLines(b,data,PR.paper), PR.paper, (scale||1)*384/dotsW(PR.paper)); }
async function ticketLines(data){ await fontsReady(); let L=[]; for(const b of ticketBlocks(data)) L=L.concat(await blockLines(b,data,PR.paper)); return L; }
async function renderTicket(data, scale){ return drawLines(await ticketLines(data), PR.paper, scale||1); }

/* ESC/POS: texto en página de códigos 858 (tildes, ñ y €) + imágenes en bloque */
const CP858={'á':0xA0,'é':0x82,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'ü':0x81,'Ü':0x9A,'¿':0xA8,'¡':0xAD,'Á':0xB5,'É':0x90,'Í':0xD6,'Ó':0xE0,'Ú':0xE9,'€':0xD5,'º':0xA7,'ª':0xA6,'·':0xFA,'ç':0x87,'Ç':0x80};
function escposLines(L, opt){
  opt=opt||{}; const b=[0x1B,0x40,0x1B,0x74,19];
  if(opt.drawer) b.push(0x1B,0x70,0x00,0x19,0xFA);
  const txt=s=>{ for(const ch of s){ const c=ch.charCodeAt(0); b.push(CP858[ch]!==undefined?CP858[ch]:(c<128?c:0x3F)); } };
  for(const l of L){
    if(l.img){ const c=l.img, w=c.width, h=c.height, bpr=Math.ceil(w/8), px=c.getContext('2d').getImageData(0,0,w,h).data;
      b.push(0x1B,0x61,0x00);
      for(let y0=0;y0<h;y0+=128){ const bh=Math.min(128,h-y0); b.push(0x1D,0x76,0x30,0x00,bpr&255,bpr>>8,bh&255,bh>>8);
        for(let y=0;y<bh;y++) for(let xb=0;xb<bpr;xb++){ let v=0; for(let k=0;k<8;k++){ const xx=xb*8+k; if(xx<w && px[((y0+y)*w+xx)*4]<128) v|=0x80>>k; } b.push(v); } }
      continue; }
    b.push(0x1B,0x61,l.align==='center'?1:l.align==='right'?2:0, 0x1D,0x21,((l.w-1)<<4)|(l.h-1), 0x1B,0x45,l.bold?1:0);
    txt(l.t); b.push(0x0A);
  }
  b.push(0x1D,0x21,0x00,0x1B,0x45,0x00,0x1B,0x61,0x00);
  if(PR.cut) b.push(0x1B,0x64,0x03,0x1D,0x56,0x42,0x10); else b.push(0x1B,0x64,0x05);
  return new Uint8Array(b);
}

/* ================= IMPRESORA BLUETOOTH (como GestFeria) ================= */
/* - App Android: impresoras clásicas ya vinculadas (cordova-plugin-bluetooth-serial) e impresoras BLE (@capacitor-community/bluetooth-le).
   - Navegador: Web Bluetooth (solo BLE). */
const PR_KEY='bettarea-printer', PR_USED='bettarea-impresoras';
const SERVICIOS_IMPRESORA=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb'];
const lsGet=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const PR=Object.assign({ paper:80, autoPrint:true, autoConnect:true, cut:true, drawer:false }, lsGet(PR_KEY,{}));
Object.assign(PR,{ method:'bt', status:'off', modo:null, id:'', nombre:'', device:null, car:null, servicio:'', carUuid:'', sinRespuesta:false, open:false, lista:null, buscando:false, err:'' });
function prSave(){ lsSet(PR_KEY,{paper:PR.paper,autoPrint:PR.autoPrint,autoConnect:PR.autoConnect,cut:PR.cut,drawer:PR.drawer}); }
const enApp=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const pluginBLE=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BluetoothLe;
const pluginSerie=()=>window.bluetoothSerial;
const btDisponible=()=>enApp()?!!(pluginBLE()||pluginSerie()):!!(navigator.bluetooth&&navigator.bluetooth.requestDevice);
const hexDe=u8=>Array.from(u8,n=>n.toString(16).padStart(2,'0')).join('');
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('tiempo')),ms))]);
function prLabel(){ return {off:'Desconectada',connecting:'Conectando…',on:'Conectada'}[PR.status]||'Desconectada'; }
function setPr(st,err){ PR.status=st; if(err!==undefined) PR.err=err||''; updPrBtn(); if(PR.open||PR.quick) drawPrinter(); }
function updPrBtn(){ const b=$('#prBtn'); if(!b) return; b.dataset.st=PR.status; b.title='Impresora: '+prLabel()+(PR.nombre?' · '+PR.nombre:''); }
function marcarConectada(modo,id,nombre){
  PR.modo=modo; PR.id=id; PR.nombre=nombre||'Impresora'; PR.err='';
  const usadas=lsGet(PR_USED,[]).filter(x=>!(x.modo===modo&&x.id===id)); usadas.unshift({modo,id,nombre:PR.nombre}); lsSet(PR_USED,usadas.slice(0,5));
  setPr('on'); toast('Conectado a '+PR.nombre); if(PR.quick) setTimeout(()=>{ if(PR.status==='on') closePrQuick(); },900);
}
function alDesconectar(){ if(PR.status!=='on') return; PR.modo=null; PR.car=null; setPr('off'); toast('Se ha perdido la conexión con la impresora'); }
async function conectarWeb(device){
  device.removeEventListener('gattserverdisconnected',alDesconectar); device.addEventListener('gattserverdisconnected',alDesconectar);
  const server=await device.gatt.connect(); let car=null;
  for(const sv of await server.getPrimaryServices()){ const cs=await sv.getCharacteristics(); car=cs.find(c=>c.properties.writeWithoutResponse||c.properties.write); if(car) break; }
  if(!car){ device.gatt.disconnect(); throw new Error('sin-escritura'); }
  PR.device=device; PR.car=car; marcarConectada('web',device.id,device.name);
}
async function permisosApp(){ const BLE=pluginBLE(); if(BLE) await BLE.initialize({androidNeverForLocation:true}); }
async function conectarBLE(deviceId,nombre){
  const BLE=pluginBLE(); await BLE.connect({deviceId,timeout:8000});
  try{ BLE.addListener('disconnected|'+deviceId,()=>alDesconectar()); }catch(e){}
  const res=await BLE.getServices({deviceId}); const svs=(res&&res.services)||(Array.isArray(res)?res:[]); let sv=null,car=null;
  for(const x of svs){ const c=(x.characteristics||[]).find(c=>c.properties&&(c.properties.writeWithoutResponse||c.properties.write)); if(c){ sv=x; car=c; break; } }
  if(!car){ try{ await BLE.disconnect({deviceId}); }catch(e){} throw new Error('sin-escritura'); }
  PR.servicio=sv.uuid; PR.carUuid=car.uuid; PR.sinRespuesta=!!car.properties.writeWithoutResponse; marcarConectada('ble',deviceId,nombre);
}
function conectarClasica(address,nombre){
  return new Promise((ok,ko)=>{ let conectado=false;
    pluginSerie().connect(address,()=>{ conectado=true; marcarConectada('clasica',address,nombre); ok(); },
      err=>{ if(conectado) alDesconectar(); else ko(new Error(String(err||'error'))); }); });
}
/* Lista de impresoras vinculadas (app) */
async function cargarLista(){
  PR.lista={estado:'cargando',devs:[]}; drawPrinter();
  try{ await permisosApp(); }catch(e){ PR.lista={estado:'permiso',devs:[]}; drawPrinter(); return; }
  const Sx=pluginSerie(); if(!Sx){ PR.lista={estado:'sinserie',devs:[]}; drawPrinter(); return; }
  Sx.isEnabled(()=>{ Sx.list(devs=>{ PR.lista={estado:'ok',devs:devs||[]}; drawPrinter(); },()=>{ PR.lista={estado:'error',devs:[]}; drawPrinter(); }); },
    ()=>{ PR.lista={estado:'apagado',devs:[]}; drawPrinter(); });
}
async function prElegir(i){
  const d=PR.lista&&PR.lista.devs[i]; if(!d) return; const nombre=d.name||'la impresora';
  setPr('connecting'); try{ await conTiempo(conectarClasica(d.address||d.id,d.name),15000); PR.lista=null; drawPrinter(); }
  catch(e){ setPr('off',`No se pudo conectar con ${nombre}. Comprueba que está encendida y cerca.`); }
}
async function prBuscarBLE(){
  const BLE=pluginBLE(); if(!BLE){ toast('La búsqueda BLE no está disponible'); return; }
  try{ await permisosApp(); const d=await BLE.requestDevice({optionalServices:SERVICIOS_IMPRESORA}); setPr('connecting'); await conectarBLE(d.deviceId,d.name); PR.lista=null; drawPrinter(); }
  catch(err){ if(err&&/cancel/i.test(String(err.message||err))){ setPr(PR.modo?'on':'off'); return; } setPr('off', err&&err.message==='sin-escritura'?'Ese dispositivo no es una impresora compatible.':'No se pudo conectar con la impresora BLE.'); }
}
async function prConnect(){
  if(enApp()){ cargarLista(); return; }
  if(!btDisponible()){ setPr('off','Este navegador no permite Bluetooth. Usa la app de Android.'); return; }
  try{ setPr('connecting'); const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SERVICIOS_IMPRESORA}); await conectarWeb(device); }
  catch(err){ const n=err&&err.name; if(n==='NotFoundError'){ setPr('off'); return; }
    setPr('off', /Security|NotAllowed/.test(n||'')||/policy|disallowed/i.test(String(err&&err.message))?'Esta vista no permite usar el Bluetooth. Usa la app de Android.':err&&err.message==='sin-escritura'?'Ese dispositivo no es una impresora compatible.':'No se pudo conectar con la impresora.'); }
}
async function prDisconnect(){
  const modo=PR.modo,id=PR.id,d=PR.device; PR.modo=null; PR.car=null; PR.device=null;
  try{ if(modo==='web'&&d&&d.gatt&&d.gatt.connected) d.gatt.disconnect();
    if(modo==='ble'&&pluginBLE()) await pluginBLE().disconnect({deviceId:id});
    if(modo==='clasica'&&pluginSerie()) pluginSerie().disconnect(()=>{},()=>{}); }catch(e){}
  setPr('off'); toast('Impresora desconectada');
}
function prForget(){ lsSet(PR_USED,[]); prDisconnect(); }
/* Reconexión automática con las impresoras ya usadas (la última primero) */
let prIntentando=false;
async function prAuto(){
  updPrBtn(); if(!PR.autoConnect||prIntentando||PR.status==='on') return;
  const usadas=lsGet(PR_USED,[]); if(!usadas.length) return; prIntentando=true;
  try{
    if(enApp()){ try{ await permisosApp(); }catch(e){ return; } setPr('connecting');
      for(const g of usadas){ if(PR.status==='on'&&PR.modo) break; try{ if(g.modo==='clasica'&&pluginSerie()) await conTiempo(conectarClasica(g.id,g.nombre),12000); else if(g.modo==='ble'&&pluginBLE()) await conTiempo(conectarBLE(g.id,g.nombre),12000); }catch(e){} }
    } else if(navigator.bluetooth&&navigator.bluetooth.getDevices){ const devs=await navigator.bluetooth.getDevices(); setPr('connecting');
      for(const g of usadas){ if(PR.modo) break; const d=devs.find(x=>x.id===g.id); if(!d) continue; try{ await conTiempo(conectarWeb(d),12000); }catch(e){ try{ d.gatt.disconnect(); }catch(_){} } } }
  }catch(e){} finally{ prIntentando=false; if(!PR.modo) setPr('off'); }
}
async function enviarBytes(datos){
  if(!PR.modo) throw new Error('sin-impresora');
  if(PR.modo==='clasica'){ const buf=datos.buffer.slice(datos.byteOffset,datos.byteOffset+datos.byteLength); await new Promise((ok,ko)=>pluginSerie().write(buf,ok,ko)); return; }
  for(let i=0;i<datos.length;i+=180){ const trozo=datos.slice(i,i+180);
    if(PR.modo==='web'){ if(PR.car.properties.writeWithoutResponse) await PR.car.writeValueWithoutResponse(trozo); else await PR.car.writeValue(trozo); }
    else { const args={deviceId:PR.id,service:PR.servicio,characteristic:PR.carUuid,value:hexDe(trozo)}; if(PR.sinRespuesta) await pluginBLE().writeWithoutResponse(args); else await pluginBLE().write(args); } }
}
let prCola=Promise.resolve();
async function printDoc(data){
  if(PR.status!=='on'||!PR.modo){ toast('Conecta la impresora primero'); openPrQuick(); return false; }

  prCola=job;
  try{ await job; return true; }catch(e){ toast('No se pudo imprimir. Comprueba la impresora'); return false; }
}

/* ================= VERSIONES Y ACTUALIZACIONES (GitHub Releases, como GestFeria) ================= */
const APP_VERSION='0.3.4';
const UPD={ repo:'makobita/BETTAREA', repoUrl:'https://github.com/makobita/BETTAREA' };
const UPD_KEY='bettarea-update';
const UPS=Object.assign({auto:true,last:0,latest:null},lsGet(UPD_KEY,{}));
UPS.state='idle'; UPS.pct=null; UPS.version=APP_VERSION;
function updSave(){ lsSet(UPD_KEY,{auto:UPS.auto,last:UPS.last,latest:UPS.latest}); }
function semverCmp(a,b){ const pa=String(a).replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0), pb=String(b).replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0); for(let i=0;i<3;i++){ if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)>(pb[i]||0)?1:-1; } return 0; }
function inClaude(){ try{ return window.self!==window.top; }catch(e){ return true; } }
const updNewer=()=>!!(UPS.latest&&semverCmp(UPS.latest.version,UPS.version)>0);
function updRedraw(){ if(DEV.open&&(DEV.tab==='upd'||!DEV.tab)) drawDev(); updBadge(); }
function updBadge(){ const b=$('#devBtn'); if(b) b.classList.toggle('badge',updNewer()); }
(async()=>{ try{ const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App; if(A&&A.getInfo){ const v=(await A.getInfo()).version; if(v) UPS.version=v; updBadge(); } }catch(e){} })();
async function checkUpdate(manual){
  if(UPS.state==='checking'||UPS.state==='downloading') return;
  UPS.state='checking'; updRedraw();
  try{
    const r=await withTimeout(fetch('https://api.github.com/repos/'+UPD.repo+'/releases/latest',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'}),12000);
    UPS.last=Date.now();
    if(r.status===404){ UPS.state='empty'; updSave(); updRedraw(); if(manual) toast('Aún no hay versiones publicadas en GitHub'); return; }
    if(!r.ok) throw new Error('http '+r.status);
    const d=await r.json(), apk=(d.assets||[]).find(a=>/\.apk$/i.test(a.name));
    UPS.latest={ version:String(d.tag_name||'').replace(/^v/i,''), date:(d.published_at||'').slice(0,10), notes:String(d.body||'').split('\n').map(s=>s.replace(/^[-*•\s]+/,'').trim()).filter(Boolean).slice(0,12), apk:apk?apk.browser_download_url:'' };
    UPS.state=updNewer()&&UPS.latest.apk?'available':'uptodate'; updSave(); updRedraw();
    if(manual) toast(UPS.state==='available'?`Nueva versión ${UPS.latest.version} disponible`:`Ya tienes la última versión (${UPS.version})`);
    else if(UPS.state==='available') toast(`Actualización disponible: v${UPS.latest.version}`);
  }catch(e){ UPS.state=inClaude()?'blocked':'error'; updRedraw(); if(manual&&UPS.state==='error') toast('No se pudo comprobar: revisa la conexión a internet'); }
}
async function installUpdate(){
  if(!UPS.latest||!UPS.latest.apk) return;
  const C=window.Capacitor, I=enApp()?(C.Plugins.Instalador||(C.registerPlugin&&C.registerPlugin('Instalador'))):null;
  if(!I){ const a=document.createElement('a'); a.href=UPS.latest.apk; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); return; }
  UPS.state='downloading'; UPS.pct=0; updRedraw(); let esc=null;
  try{ esc=await I.addListener('progreso',p=>{ UPS.pct=p&&p.pct>=0?p.pct:null; const b=$('#updbar'); if(b) b.style.width=(UPS.pct==null?50:UPS.pct)+'%'; const t=$('#updpct'); if(t) t.textContent=UPS.pct==null?Math.round((p.bytes||0)/104857.6)/10+' MB':UPS.pct+' %'; }); }catch(_){}
  try{ const res=await I.instalar({url:UPS.latest.apk}); if(res&&res.permiso===false) toast('Activa «Permitir de esta fuente» y vuelve a pulsar Instalar'); }
  catch(e){ toast('No se pudo descargar la actualización'); }
  finally{ UPS.state='available'; try{ esc&&esc.remove(); }catch(_){} updRedraw(); }
}
function agoTxt(ts){ if(!ts) return 'nunca'; const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'hace un momento'; if(m<60) return `hace ${m} min`; const h=Math.round(m/60); if(h<24) return `hace ${h} h`; return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}); }
function cfgUpd(){
  const L=UPS.latest, nw=updNewer(), st=UPS.state;
  const stateCard =
    st==='checking' ? `<div class="updst"><span class="spin"></span><div><b>Buscando actualizaciones…</b><small>Consultando GitHub</small></div></div>`
  : st==='downloading' ? `<div class="updst new"><span class="spin"></span><div style="flex:1"><b>Descargando versión ${esc(L.version)}…</b><small id="updpct">${UPS.pct==null?'':UPS.pct+' %'}</small><div class="prog"><i id="updbar" style="width:${UPS.pct||0}%"></i></div></div></div>`
  : nw ? `<div class="updst new"><span class="updic">${I.down}</span><div><b>Nueva versión ${esc(L.version)}</b><small>${L.date?esc(fdate(L.date)):''}</small></div></div>
      ${L.notes&&L.notes.length?`<div class="devcard"><h4>Novedades</h4><ul class="updnotes">${L.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
      <button class="btn btn-p" style="height:52px" onclick="installUpdate()">${I.down}Descargar e instalar ${esc(L.version)}</button>
      <p class="note" style="margin:0;font-size:12.5px">Se descarga el instalador; al terminar pulsa «Instalar». No se pierde ningún dato.</p>`
  : st==='uptodate' ? `<div class="updst ok"><span class="updic">${I.check}</span><div><b>La app está al día</b><small>Tienes la última versión publicada</small></div></div>`
  : st==='empty' ? `<div class="updst"><span class="updic">${I.box}</span><div><b>Aún no hay versiones publicadas</b><small>GitHub compila la primera al subir el proyecto</small></div></div>`
  : st==='blocked' ? `<div class="infobox"><b>Desde aquí no se puede consultar GitHub.</b> La búsqueda de actualizaciones funciona en la app de Android.</div>`
  : st==='error' ? `<div class="warnbox">No se pudo comprobar. Revisa la conexión a internet y vuelve a intentarlo.</div>` : '';
  return `
  <div class="updhead"><img src="${DEFAULT_LOGO()}" alt=""><div><b>Bettarea</b><small>Versión instalada</small></div><span class="verpill">v${esc(UPS.version)}</span></div>
  ${stateCard}
  ${!nw&&st!=='downloading'?`<button class="btn ${st==='blocked'?'btn-g':'btn-p'}" style="height:50px" ${st==='checking'?'disabled':''} onclick="checkUpdate(true)">${I.refresh}Buscar actualización</button>`:''}
  <div class="toggle ${UPS.auto?'on':''}" onclick="UPS.auto=!UPS.auto;updSave();drawDev()"><div><b>Buscar al abrir la app</b><small>Una vez al día, te avisa si hay una versión nueva</small></div><span class="sw"></span></div>
  <div class="devcard"><div class="devkv">
    <span>Repositorio</span><b>${esc(UPD.repo)}</b>
    <span>Última versión publicada</span><b>${L?'v'+esc(L.version):'—'}</b>
    <span>Última comprobación</span><b>${agoTxt(UPS.last)}</b>
  </div></div>`;
}

/* ================= RECORDATORIOS ================= */
/* En la app de Android, además del aviso en pantalla, se programa una notificación del sistema que suena aunque la app esté cerrada */
const pluginNotif=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const rmNid=id=>{ let h=7; for(const c of String(id)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h)%2000000000+1; };
async function rmNotif(r){ const N=pluginNotif(); if(!N||!r||r.done) return; try{
  const p=await N.checkPermissions(); if(p.display!=='granted'){ const q=await N.requestPermissions(); if(q.display!=='granted') return; }
  try{ await N.cancel({notifications:[{id:rmNid(r.id)}]}); }catch(_){}
  if(r.ts>Date.now()) await N.schedule({notifications:[{id:rmNid(r.id),title:'Bettarea · Recordatorio',body:r.text,schedule:{at:new Date(r.ts),allowWhileIdle:true}}]});
}catch(e){} }
async function rmUnNotif(id){ const N=pluginNotif(); if(!N) return; try{ await N.cancel({notifications:[{id:rmNid(id)}]}); }catch(e){} }
const RM={ open:false, text:'', date:'', time:'', showDone:false, queue:[], showing:null };
const pad2=n=>String(n).padStart(2,'0');
const hm=d=>pad2(d.getHours())+':'+pad2(d.getMinutes());
function rmDefaults(){ const d=new Date(Date.now()+60*60000); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0); RM.date=ymd(d); RM.time=hm(d); }
function rmDayLabel(ts){ const d=new Date(ts), t=ymd(new Date()), tm=ymd(new Date(Date.now()+86400000)); const k=ymd(d);
  if(k===t) return 'Hoy'; if(k===tm) return 'Mañana'; const s=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function rmPending(){ return (S.reminders||[]).filter(r=>!r.done).sort((a,b)=>a.ts-b.ts); }
function rmBadge(){ const b=$('#rmBtn'); if(!b) return; const now=Date.now(), end=bizEnd(bizDate(now));
  const n=rmPending().filter(r=>r.ts<=end).length; const c=b.querySelector('.rmcount'); if(c){ c.textContent=n; c.style.display=n?'flex':'none'; } }
function openReminders(){ if(F) closeDrawer(); DEV.open=false; PR.open=false; $('#drawer').classList.remove('wide','xwide');
  RM.open=true; RM.text=''; rmDefaults(); drawReminders(); $('#drawer').classList.add('on'); $('#ov').classList.add('on'); }
function rmQuick(min, at){ let d; if(at){ d=new Date(); d.setDate(d.getDate()+1); const [h,m]=at.split(':'); d.setHours(+h,+m,0,0); } else { d=new Date(Date.now()+min*60000); d.setSeconds(0,0); }
  RM.date=ymd(d); RM.time=hm(d); drawReminders(); }
function drawReminders(){
  if(!RM.open) return;
  const list=rmPending(), done=(S.reminders||[]).filter(r=>r.done).sort((a,b)=>b.ts-a.ts).slice(0,20), now=Date.now();
  const sc=$('#drawer .db'), top=sc?sc.scrollTop:0;
  $('#drawer').innerHTML=`
  <div class="dh"><b>Recordatorios</b><button class="icon-btn" onclick="closeDrawer()">${I.x}</button></div>
  <div class="db">
    <div class="rmnew">
      <div class="sec-t">Nuevo recordatorio</div>
      <textarea class="inp ta" id="rm-text" rows="2" placeholder="¿Qué quieres recordar? Ej. Pedir artemia al proveedor" oninput="RM.text=this.value">${esc(RM.text)}</textarea>
      <div class="row2">
        <div class="field"><label>Día</label><input class="inp" type="date" value="${RM.date}" onchange="RM.date=this.value"></div>
        <div class="field"><label>Hora</label><input class="inp" type="time" value="${RM.time}" onchange="RM.time=this.value"></div>
      </div>
      <div class="rmquick"><button onclick="rmQuick(30)">En 30 min</button><button onclick="rmQuick(60)">En 1 h</button><button onclick="rmQuick(180)">En 3 h</button><button onclick="rmQuick(0,'09:00')">Mañana 9:00</button></div>
      <button class="btn btn-p" style="height:50px" onclick="rmAdd()">${I.bell}Añadir recordatorio</button>
    </div>
    <div class="sec-t">Próximos <span class="cnt">${list.length}</span></div>
    ${list.length?`<div class="cfgcard">${list.map(r=>`<div class="rmrow ${r.ts<=now?'due':''}">
        <div class="rmwhen"><b>${esc(rmDayLabel(r.ts))}</b><span>${hm(new Date(r.ts))}</span></div>
        <div class="rmtxt">${esc(r.text)}</div>
        <div class="rowact"><button class="icon-btn" title="Hecho" onclick="rmDone('${r.id}')">${I.check}</button><button class="icon-btn danger" title="Eliminar" onclick="rmDel('${r.id}')">${I.trash}</button></div>
      </div>`).join('')}</div>`
    :`<div class="card empty" style="padding:28px 16px">${I.bell}<b>No tienes recordatorios pendientes</b>Crea uno arriba y te avisaré a la hora indicada.</div>`}
    ${done.length?`<button class="btn btn-t" style="align-self:flex-start" onclick="RM.showDone=!RM.showDone;drawReminders()">${RM.showDone?'Ocultar':'Ver'} completados (${done.length})</button>

async function rmAdd(){
  const text=(RM.text||'').trim(); if(!text){ const t=$('#rm-text'); t&&t.classList.add('err'); t&&t.focus(); toast('Escribe qué quieres recordar'); return; }
  if(!RM.date||!RM.time){ toast('Elige día y hora'); return; }
  const [y,m,d]=RM.date.split('-').map(Number), [h,mi]=RM.time.split(':').map(Number);
  const ts=new Date(y,m-1,d,h,mi,0,0).getTime();
  if(ts<Date.now()-60000){ toast('Esa hora ya ha pasado'); return; }
  const nr={id:uid(),ts,text,done:false,fired:false,created:Date.now()};
  await safe(()=>Store.put('reminders',nr)); rmNotif(nr);
  RM.text=''; rmDefaults(); toast('Recordatorio para '+rmDayLabel(ts).toLowerCase()+' a las '+hm(new Date(ts)));
  rmAskNotif(); drawReminders(); rmBadge();
}
async function rmDone(id){ rmUnNotif(id); await safe(()=>Store.patch('reminders',id,{done:true,fired:true})); drawReminders(); rmBadge(); }
async function rmDel(id){ rmUnNotif(id); await safe(()=>Store.del('reminders',id)); drawReminders(); rmBadge(); }

/* Aviso */
let audioCtx=null;
document.addEventListener('pointerdown',()=>{ try{ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} },{passive:true});
function rmBeep(){ try{ if(!audioCtx) return; const t0=audioCtx.currentTime;
  [0,0.28,0.56].forEach((d,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=i===2?1175:880;
    g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.24);
    o.connect(g); g.connect(audioCtx.destination); o.start(t0+d); o.stop(t0+d+0.26); }); }catch(e){} }
function rmAskNotif(){}
function rmSysNotify(r){ try{ if(document.hidden && 'Notification' in window && Notification.permission==='granted') new Notification('Bettarea · Recordatorio',{body:r.text}); }catch(e){} }
function rmCheck(){
  if(!S.ready) return; const now=Date.now();
  for(const r of (S.reminders||[])){ if(!r.done && !r.fired && r.ts<=now && !RM.queue.some(q=>q.id===r.id) && (!RM.showing||RM.showing.id!==r.id)) RM.queue.push(r); }
  if(!RM.showing && RM.queue.length) rmShow(RM.queue.shift());
  rmBadge();
}
function rmShow(r){
  RM.showing=r; const late=Date.now()-r.ts>5*60000;
  const el=$('#alarm');
  el.innerHTML=`<div class="alarm-card">
    <div class="alarm-ic">${I.bell}</div>
    <div class="alarm-t">${late?'Recordatorio pendiente':'Recordatorio'}</div>
    <div class="alarm-when">${esc(rmDayLabel(r.ts))} · ${hm(new Date(r.ts))}</div>
    <div class="alarm-txt">${esc(r.text)}</div>
    <div class="alarm-acts"><button class="btn btn-g" onclick="rmSnooze(10)">Posponer 10 min</button><button class="btn btn-p" onclick="rmAck()">${I.check}Hecho</button></div>
  </div>`;
  el.classList.add('on'); rmBeep(); setTimeout(rmBeep,1600); rmSysNotify(r);
  Store.patch('reminders',r.id,{fired:true}).catch(()=>{});
}
function rmClose(){ $('#alarm').classList.remove('on'); RM.showing=null; setTimeout(rmCheck,400); }
async function rmAck(){ const r=RM.showing; rmClose(); if(r) await safe(()=>Store.patch('reminders',r.id,{done:true,fired:true})); drawReminders(); rmBadge(); }
async function rmSnooze(min){ const r=RM.showing; rmClose(); if(r){ const ts=Date.now()+min*60000; await safe(()=>Store.patch('reminders',r.id,{ts,fired:false})); rmNotif({...r,ts,done:false}); toast('Te lo recuerdo a las '+hm(new Date(ts))); } drawReminders(); rmBadge(); }
setInterval(rmCheck, 10000);

boot();
setTimeout(rmCheck,3000);
setTimeout(function chk(){ if(S.ready && (S.mode==='local'||S.products.length)) fixDemoPhotos(); else setTimeout(chk,1500); }, 2500);
updBadge();
if(UPS.auto && !inClaude() && new Date(UPS.last||0).toDateString()!==new Date().toDateString()) setTimeout(()=>checkUpdate(false), 5000);
setTimeout(prAuto, 600);
</script>
